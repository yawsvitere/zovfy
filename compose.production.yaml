name: zovfy-production

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zovfy}
      POSTGRES_USER: ${POSTGRES_USER:-zovfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    image: ${IMAGE_NAMESPACE:-ghcr.io/yawsvitere}/zovfy-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-zovfy};Username=${POSTGRES_USER:-zovfy};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-zovfy-api}
      Jwt__Audience: ${JWT_AUDIENCE:-zovfy-web}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      Storage__Endpoint: http://minio:9000
      Storage__Bucket: ${MINIO_BUCKET:-zovfy-files}
      Storage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      Cors__Origins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    image: ${IMAGE_NAMESPACE:-ghcr.io/yawsvitere}/zovfy-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
